{% extends "account/layout.html" %}
{% block acct %}
<h1>เปลี่ยนรหัสผ่าน</h1>
<form class="form form-narrow" method="post" novalidate>
  {% if errors %}<ul class="errors" role="alert">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="current">รหัสผ่านปัจจุบัน</label>
  <input id="current" name="current" type="password" autocomplete="current-password" required>
  <label for="password">รหัสผ่านใหม่ (อย่างน้อย 8 ตัว ผสมตัวอักษรและตัวเลข)</label>
  <input id="password" name="password" type="password" autocomplete="new-password" required>
  <label for="again">ยืนยันรหัสผ่านใหม่</label>
  <input id="again" name="again" type="password" autocomplete="new-password" required>
  <button class="btn btn-primary" type="submit">เปลี่ยนรหัสผ่าน</button>
</form>
{% endblock %}
