{% extends "admin/base.html" %}
{% block title %}เปลี่ยนรหัสผ่าน{% endblock %}
{% block content %}
<h1>เปลี่ยนรหัสผ่าน</h1>
{% if errors %}<ul class="errors" role="alert">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
<form class="panel narrow-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="current">รหัสผ่านปัจจุบัน</label>
  <input id="current" name="current" type="password" autocomplete="current-password" required>
  <label for="new">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label>
  <input id="new" name="new" type="password" autocomplete="new-password" minlength="8" required>
  <label for="again">ยืนยันรหัสผ่านใหม่</label>
  <input id="again" name="again" type="password" autocomplete="new-password" minlength="8" required>
  <button class="btn" type="submit">บันทึก</button>
</form>
{% endblock %}
